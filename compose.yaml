# The editor in Docker, on the clone's workspace/ folder (an empty one first
# gets the compiler's examples): docker compose up --build
# Then open http://localhost:8080/ on the host. See README.md, "Run with Docker".
services:
  editor:
    build: .
    # The editor has no login: reachable only from this computer.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./workspace:/workspace
    # Files are written as this user. On Linux, if your user id is not 1000:
    # HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up --build
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
